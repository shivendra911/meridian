<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <filter id="sh_mgmt" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="960" height="580" rx="16" fill="#F8FAFC"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="42" rx="16" fill="#0F172A"/>
  <rect x="0" y="26" width="960" height="16" fill="#0F172A"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <text x="480" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Meridian · Executive Management Perspective (/management/analytics)</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="200" height="538" fill="#0B1B3D"/>
  <rect x="18" y="58" width="28" height="28" rx="6" fill="#8C1515"/>
  <text x="32" y="77" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">M</text>
  <text x="56" y="77" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">MERIDIAN</text>
  
  <text x="20" y="112" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">EXECUTIVE DIRECTORATE</text>

  <!-- Nav items -->
  <rect x="10" y="124" width="180" height="32" rx="6" fill="#1E293B"/>
  <text x="24" y="145" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">📊 Executive Brief</text>
  
  <text x="24" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">🏛️ NIRF Accreditation</text>
  <text x="24" y="212" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">⚖️ Fairness Audit (7,141)</text>
  <text x="24" y="244" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">🤖 Copilot Execution Runs</text>
  <text x="24" y="276" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">📈 15 Aggregation Reports</text>
  <text x="24" y="308" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">🔒 DPDP Compliance</text>
  <text x="24" y="340" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">⚙️ Institution Settings</text>

  <!-- Main Content Header -->
  <g transform="translate(225, 60)">
    <text x="0" y="18" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Institutional Executive Directorate</text>
    <text x="0" y="36" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Prof. Dr. P. K. Bansal &bull; Vice-Chancellor &bull; Scope: Entire Institutional Registry</text>
  </g>

  <!-- 4 StatCards -->
  <g transform="translate(225, 115)" filter="url(#sh_mgmt)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="165" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="24" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">NIRF Outcome Score</text>
    <text x="14" y="52" fill="#DB2777" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">88.4 <tspan font-size="14" fill="#64748B">/ 100</tspan></text>

    <!-- Card 2 -->
    <rect x="180" y="0" width="165" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="194" y="24" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Total Enrolled Cohort</text>
    <text x="194" y="52" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">7,141</text>
    <text x="250" y="50" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11">94.2% Placed</text>

    <!-- Card 3 -->
    <rect x="360" y="0" width="165" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="374" y="24" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Disparate Impact Ratio</text>
    <text x="374" y="52" fill="#059669" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">0.842</text>
    <text x="440" y="50" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11">✓ Compliant</text>

    <!-- Card 4 -->
    <rect x="540" y="0" width="165" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="554" y="24" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Sensitive Proxy Prohib</text>
    <text x="554" y="52" fill="#059669" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">0 Violations</text>
    <text x="635" y="50" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11">Passed</text>
  </g>

  <!-- What Needs Me Now -->
  <g transform="translate(225, 210)">
    <text x="0" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">⚡ WHAT NEEDS ME NOW (Executive Accreditation Actions)</text>

    <!-- TaskCard 1: NIRF submission -->
    <g transform="translate(0, 26)" filter="url(#sh_mgmt)">
      <rect width="345" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="12" y="12" width="105" height="18" rx="4" fill="#FCE7F3"/>
      <text x="64" y="25" fill="#BE185D" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NIRF DEADLINE</text>
      <text x="12" y="48" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">GPH &amp; GMS Annual Accreditation Report</text>
      <text x="12" y="65" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Median package and higher studies verified for 2026</text>
      <rect x="210" y="52" width="122" height="26" rx="4" fill="#DB2777"/>
      <text x="271" y="69" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Export Sign-off →</text>
    </g>

    <!-- TaskCard 2: Fairness audit review -->
    <g transform="translate(360, 26)" filter="url(#sh_mgmt)">
      <rect width="345" height="90" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
      <rect x="12" y="12" width="95" height="18" rx="4" fill="#DCFCE7"/>
      <text x="59" y="25" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FAIRNESS AUDIT</text>
      <text x="12" y="48" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">7,141 Candidates Evaluated Across Slices</text>
      <text x="12" y="65" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Zero sensitive attributes (gender, caste, state) detected</text>
      <rect x="230" y="52" width="102" height="26" rx="4" fill="#059669"/>
      <text x="281" y="69" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Audit Ledger →</text>
    </g>
  </g>

  <!-- Live Fairness Table -->
  <g transform="translate(225, 350)">
    <text x="0" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">⚖️ DEMOGRAPHIC SLICE PARITY (Evaluated Across 7,141 Students in 6.7s)</text>

    <!-- Row 1 -->
    <g transform="translate(0, 26)" filter="url(#sh_mgmt)">
      <rect width="705" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">School of Computing &amp; AI (SCAI) &bull; N = 2,840 Students</text>
      <text x="20" y="48" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Mean CGPA: 8.21 &bull; Selection Rate (High Prob): 78.4% &bull; Actual Placement Rate: 95.8% &bull; Status: COMPLIANT ✓</text>
      <rect x="580" y="24" width="110" height="28" rx="4" fill="#0F172A"/>
      <text x="635" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Inspect Slice →</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 112)" filter="url(#sh_mgmt)">
      <rect width="705" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">School of Engineering &amp; Technology (SET) &bull; N = 4,301 Students</text>
      <text x="20" y="48" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Mean CGPA: 7.74 &bull; Selection Rate (High Prob): 68.2% &bull; Actual Placement Rate: 93.1% &bull; Status: COMPLIANT ✓</text>
      <rect x="580" y="24" width="110" height="28" rx="4" fill="#0F172A"/>
      <text x="635" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Inspect Slice →</text>
    </g>
  </g>

  <!-- Bottom Endpoints Bar -->
  <rect x="225" y="552" width="705" height="20" fill="none"/>
  <text x="225" y="566" fill="#94A3B8" font-family="monospace" font-size="10">Endpoints: GET .../nirf/metrics/ &bull; GET .../fairness/audit/ &bull; GET .../agents/runs/ &bull; GET .../reports/</text>
</svg>
