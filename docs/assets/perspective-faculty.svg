      <circle cx="36" cy="38" r="18" fill="#EFF6FF"/>
      <text x="36" y="44" fill="#2563EB" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AS</text>
      
      <text x="68" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Aarav Sharma &bull; STU001</text>
