  <text x="480" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Meridian · Faculty Advisory Perspective (/faculty/mentees)</text>

