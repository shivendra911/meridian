      <text x="20" y="48" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Submitted Email: v.murthy@univ.edu &bull; Status: One-Time Token Expired &bull; Action: Resend Invite Token</text>
      <rect x="580" y="24" width="110" height="28" rx="4" fill="#0F172A"/>
      <text x="635" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Resend Token →</text>
