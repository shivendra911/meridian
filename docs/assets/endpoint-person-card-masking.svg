<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bg2)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="48" rx="16" fill="#0A0F1D"/>
  <rect x="0" y="32" width="1000" height="16" fill="#0A0F1D"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  <text x="500" y="29" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">DPDP Act 2023 Compliance — GET /api/people/{person_id}/card/</text>

  <!-- Subtitle -->
  <text x="500" y="80" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Dynamic Field-Level Privacy Redaction Evaluated Server-Side</text>
  <text x="500" y="102" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Same endpoint payload adjusts automatically based on active caller's verified institutional relationship</text>

  <!-- Left Card: Peer Student View (Masked) -->
  <g transform="translate(60, 130)" filter="url(#shadow2)">
    <rect width="410" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Header banner -->
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#FEF3C7"/>
    <rect x="0" y="28" width="410" height="12" fill="#FEF3C7"/>
    <text x="20" y="25" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">VIEWER: PEER STUDENT (STU001)</text>
    <rect x="290" y="10" width="105" height="20" rx="10" fill="#FDE68A"/>
    <text x="342" y="24" fill="#B45309" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">PRIVACY MASKED</text>

    <!-- Avatar + Name -->
    <circle cx="60" cy="85" r="28" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
    <text x="60" y="93" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DP</text>
    
    <text x="105" y="78" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Diya Patel</text>
    <text x="105" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Computer Science &amp; Engineering &bull; 2026</text>

    <!-- Fields Table -->
    <g transform="translate(20, 135)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Email:</text>
      <text x="100" y="22" fill="#94A3B8" font-family="monospace" font-size="12">d••••••••••@univ.edu</text>
      <text x="320" y="22" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="600">[Masked]</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Phone:</text>
      <text x="100" y="22" fill="#94A3B8" font-family="monospace" font-size="12">+91 ••••• •••••</text>
      <text x="320" y="22" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="600">[Masked]</text>
    </g>

    <g transform="translate(20, 225)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">CGPA:</text>
      <text x="100" y="22" fill="#94A3B8" font-family="monospace" font-size="12">Hidden by institution policy</text>
      <text x="320" y="22" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="600">[Null]</text>
    </g>

    <g transform="translate(20, 270)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Status:</text>
      <text x="100" y="22" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">✓ Verified Enrolled Student</text>
    </g>

    <g transform="translate(20, 318)">
      <rect width="370" height="42" rx="6" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1"/>
      <text x="15" y="26" fill="#B91C1C" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Protected under India Digital Personal Data Protection Act</text>
    </g>
  </g>

  <!-- Right Card: Faculty / TPO View (Unmasked) -->
  <g transform="translate(530, 130)" filter="url(#shadow2)">
    <rect width="410" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Header banner -->
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#DCFCE7"/>
    <rect x="0" y="28" width="410" height="12" fill="#DCFCE7"/>
    <text x="20" y="25" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">VIEWER: FACULTY / TPO ADMIN</text>
    <rect x="300" y="10" width="95" height="20" rx="10" fill="#BBF7D0"/>
    <text x="347" y="24" fill="#15803D" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">FULL ACCESS</text>

    <!-- Avatar + Name -->
    <circle cx="60" cy="85" r="28" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="60" y="93" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DP</text>
    
    <text x="105" y="78" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Diya Patel</text>
    <text x="105" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Computer Science &amp; Engineering &bull; 2026</text>

    <!-- Fields Table -->
    <g transform="translate(20, 135)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Email:</text>
      <text x="100" y="22" fill="#0F172A" font-family="monospace" font-size="12">diya.rep@univ.edu</text>
      <text x="320" y="22" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">[Active]</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Phone:</text>
      <text x="100" y="22" fill="#0F172A" font-family="monospace" font-size="12">+91 98765 43210</text>
      <text x="320" y="22" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">[Verified]</text>
    </g>

    <g transform="translate(20, 225)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">CGPA:</text>
      <text x="100" y="22" fill="#0F172A" font-family="monospace" font-size="12" font-weight="700">9.42 / 10.00</text>
      <text x="300" y="22" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">[0 Backlogs]</text>
    </g>

    <g transform="translate(20, 270)">
      <rect width="370" height="35" rx="6" fill="#F8FAFC"/>
      <text x="15" y="22" fill="#64748B" font-family="monospace" font-size="12">Status:</text>
      <text x="100" y="22" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">✓ Placement Representative</text>
    </g>

    <g transform="translate(20, 318)">
      <rect width="370" height="42" rx="6" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
      <text x="15" y="26" fill="#15803D" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Authorized for institutional mentoring &amp; recruitment operations</text>
    </g>
  </g>
</svg>
