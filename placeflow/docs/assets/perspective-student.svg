      <text x="36" y="44" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">M</text>
      
      <text x="68" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Microsoft — Cloud &amp; AI Systems Engineer</text>
