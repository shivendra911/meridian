<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg4)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="48" rx="16" fill="#090A1A"/>
  <rect x="0" y="32" width="1000" height="16" fill="#090A1A"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  <text x="500" y="29" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Operational Business Moats — Superday Room Solver &amp; Atomic Seat Cascading</text>

  <!-- Left Half: Superday Room Contention Solver -->
  <g transform="translate(45, 75)" filter="url(#shadow4)">
    <rect width="435" height="410" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <rect x="0" y="0" width="435" height="45" rx="12" fill="#312E81"/>
    <rect x="0" y="33" width="435" height="12" fill="#312E81"/>
    <text x="20" y="28" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">1. Superday Multi-Room Conflict Solver</text>
    <rect x="335" y="12" width="80" height="20" rx="10" fill="#4338CA"/>
    <text x="375" y="26" fill="#E0E7FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">NP-HARD</text>

    <!-- Content -->
    <g transform="translate(20, 60)">
      <rect width="395" height="65" rx="8" fill="#0F172A" stroke="#DC2626" stroke-width="1"/>
      <text x="14" y="22" fill="#F87171" font-family="monospace" font-size="11" font-weight="700">⚠️ Room Collision Detected (GET .../conflicts/)</text>
      <text x="14" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Lab 402 double-booked: Google (10:00 AM) &amp; Microsoft (10:15 AM)</text>
      <text x="14" y="56" fill="#94A3B8" font-family="sans-serif" font-size="11">Candidate: Aarav Sharma overlapping interview round 2</text>
    </g>

    <!-- Arrow -->
    <path d="M 217 140 L 217 165 M 211 159 L 217 165 L 223 159" stroke="#818CF8" stroke-width="2" fill="none"/>

    <g transform="translate(20, 180)">
      <rect width="395" height="85" rx="8" fill="#0F172A" stroke="#4F46E5" stroke-width="1"/>
      <rect x="14" y="12" width="165" height="22" rx="4" fill="#4338CA"/>
      <text x="96" y="27" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">POST .../superday/resolve/</text>
      <text x="14" y="52" fill="#C7D2FE" font-family="sans-serif" font-size="11">Algorithmic constraint satisfaction solver</text>
      <text x="14" y="70" fill="#94A3B8" font-family="sans-serif" font-size="11">Reallocates Microsoft loop to Lab 405 (Zero schedule drift)</text>
    </g>

    <g transform="translate(20, 285)">
      <rect width="395" height="60" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="14" y="24" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">✓ 1-Click Auto-Arbitration Completed</text>
      <text x="14" y="44" fill="#A7F3D0" font-family="sans-serif" font-size="11">Updated interview records with was_rescheduled: true</text>
    </g>

    <text x="20" y="380" fill="#818CF8" font-family="monospace" font-size="11">Result: Eliminates recruiter panel idle time on Day-1 Superdays</text>
  </g>

  <!-- Right Half: Atomic Seat Cascading Engine -->
  <g transform="translate(520, 75)" filter="url(#shadow4)">
    <rect width="435" height="410" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <rect x="0" y="0" width="435" height="45" rx="12" fill="#065F46"/>
    <rect x="0" y="33" width="435" height="12" fill="#065F46"/>
    <text x="20" y="28" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">2. Atomic Seat Cascading Engine</text>
    <rect x="330" y="12" width="85" height="20" rx="10" fill="#047857"/>
    <text x="372" y="26" fill="#D1FAE5" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ACID rs0</text>

    <!-- Cascading Steps -->
    <g transform="translate(20, 60)">
      <rect width="395" height="55" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="25" cy="28" r="12" fill="#10B981"/>
      <text x="25" y="32" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="48" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Candidate Accepts "Dream" Offer (18 LPA)</text>
      <text x="48" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Triggers client.start_session() multi-document transaction</text>
    </g>

    <g transform="translate(20, 125)">
      <rect width="395" height="55" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="25" cy="28" r="12" fill="#F59E0B"/>
      <text x="25" y="32" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="48" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Revoke Former "Normal" Offer (7 LPA)</text>
      <text x="48" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Company A vacancy counter automatically incremented (+1)</text>
    </g>

    <g transform="translate(20, 190)">
      <rect width="395" height="55" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="25" cy="28" r="12" fill="#3B82F6"/>
      <text x="25" y="32" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="48" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Promote Top Waitlisted Candidate Runner-Up</text>
      <text x="48" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Scans merit-ranked candidate queue and issues seat</text>
    </g>

    <g transform="translate(20, 255)">
      <rect width="395" height="55" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="25" cy="28" r="12" fill="#8B5CF6"/>
      <text x="25" y="32" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <text x="48" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Immutable Audit Feed Event Logged</text>
      <text x="48" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Appends to activity_feed within same replica set commit</text>
    </g>

    <text x="20" y="355" fill="#34D399" font-family="monospace" font-size="11">Guaranteed ACID Execution: All operations commit or rollback</text>
    <text x="20" y="380" fill="#94A3B8" font-family="monospace" font-size="11">Zero corporate partner seat vacancy loss during campus season</text>
  </g>
</svg>
