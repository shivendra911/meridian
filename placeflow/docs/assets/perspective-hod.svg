  <text x="24" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">👥 Student Cohort (412)</text>
  <text x="24" y="212" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">🧑‍🏫 Faculty Roster (18)</text>
  <text x="24" y="244" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">⚖️ Waiver Approvals</text>
  <text x="24" y="276" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">📈 Academic Progression</text>
  <text x="24" y="308" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">🏢 Company Hiring Stats</text>
  <text x="24" y="340" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">⚙️ Account Area</text>

