      <rect x="12" y="12" width="95" height="18" rx="4" fill="#EDE9FE"/>
      <text x="59" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOAD BALANCE</text>
      <text x="12" y="48" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">2 Faculty Mentors Overallocated (>30 Mentees)</text>
      <text x="12" y="65" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Reassign 8 students to junior faculty to meet NEP norms</text>
      <rect x="230" y="52" width="102" height="26" rx="4" fill="#7C3AED"/>
      <text x="281" y="69" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Rebalance →</text>
