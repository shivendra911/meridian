      <text x="20" y="30" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Dr. Janpreet Singh &bull; Associate Professor &bull; FAC11266</text>
      <text x="20" y="48" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Mentees: 24 Assigned &bull; Placed: 19 (79%) &bull; Active Advisory Interventions: 2 &bull; Load: Optimal ✓</text>
      <rect x="580" y="24" width="110" height="28" rx="4" fill="#0F172A"/>
      <text x="635" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">View Group →</text>
