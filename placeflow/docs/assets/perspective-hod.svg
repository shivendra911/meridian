    <text x="554" y="24" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dept Median Package</text>
    <text x="554" y="52" fill="#059669" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">16.2 LPA</text>
